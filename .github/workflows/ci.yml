name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dev dependencies (locked)
        run: |
          pip install -r requirements-dev.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dev dependencies (locked)
        run: |
          pip install -r requirements-dev.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -e .

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: "Dependency Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install pip-audit (locked version)
        run: pip install "$(grep -E '^pip-audit==' requirements-dev.lock)"

      # Accepted risk, no fixed release yet: the chromadb advisories target the Chroma server
      # HTTP API (trust_remote_code collection RCE, RBAC/tenant checks). Our server is only
      # reachable inside the compose network, without auth or multi-tenancy. Re-check on upgrade.
      - name: Audit locked runtime dependencies
        run: >
          pip-audit -r requirements.lock --disable-pip --no-deps
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
