[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deployd"
version = "0.1.0"
description = "Incident investigation and remediation retrieval system using AI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "agno>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "streamlit>=1.35",
    "pyvis>=0.3",
    "groq>=0.9",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "multidict>=6.9.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    # Same versions as .pre-commit-config.yaml, so local, hook and CI agree.
    "mypy==1.10.1",
    "ruff==0.5.5",
    "pre-commit>=3.7,<5",
    "pip-audit>=2.7,<3",
    "uv>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deployd*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["deployd", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = ["E501", "TCH001", "TCH002", "TCH003", "TCH004"]  # line length handled by ruff format, TCH ignored for Pydantic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests


[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]

[[tool.mypy.overrides]]
module = "deployd.domain.*"
disallow_untyped_defs = true
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=deployd",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    "-v",
]

[tool.coverage.run]
source = ["deployd"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
