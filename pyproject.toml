[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deployd"
version = "0.1.0"
description = "Incident investigation and remediation retrieval system using AI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "agno>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "streamlit>=1.35",
    "pyvis>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deployd*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["deployd", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests


[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]

[[tool.mypy.overrides]]
module = "deployd.domain.*"
disallow_untyped_defs = true
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=deployd",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",   # Build fails if coverage drops below 80%
    "-v",
]

[tool.coverage.run]
source = ["deployd"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
