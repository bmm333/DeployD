<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeployD — Incident Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d0e11;
      --surface:  #161820;
      --surface2: #1e2029;
      --border:   #2a2c38;
      --text:     #e4e6f0;
      --muted:    #6b7089;
      --blue:     #007AFF;
      --green:    #34C759;
      --amber:    #FF9500;
      --red:      #FF3B30;
      --radius:   10px;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* HEADER */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 54px; flex-shrink: 0;
      background: rgba(22, 24, 32, 0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .logo span { color: var(--blue); }
    .spacer { flex: 1; }
    .kpi { font-size: 12px; color: var(--muted); }
    .kpi strong { color: var(--text); font-weight: 600; }

    .status-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      background: var(--surface2); border: 1px solid var(--border); transition: all 0.3s;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-badge.healthy  { color: var(--green); border-color: #34C75930; }
    .status-badge.healthy .status-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-badge.degrading { color: var(--amber); border-color: #FF950030; }
    .status-badge.degrading .status-dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .status-badge.critical { color: var(--red); border-color: #FF3B3030; animation: pulse-badge 1.5s infinite; }
    .status-badge.critical .status-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
    @keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:0.7} }

    .btn {
      padding: 6px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 500;
      font-family: 'Inter', sans-serif; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); transition: background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: var(--border); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-primary:hover { background: #0066d6; }
    .btn-danger { background: transparent; color: var(--red); border-color: #FF3B3040; }
    .btn-danger:hover { background: #FF3B3015; }

    /* MAIN */
    .main { display: flex; flex: 1; overflow: hidden; }
    .panel-title {
      padding: 12px 16px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .empty-state { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; }

    /* LEFT: GRAPH + FEED */
    .panel-left { width: 45%; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    #graph-canvas { flex: 1; min-height: 0; background: var(--bg); }
    .node-feed { height: 200px; overflow-y: auto; border-top: 1px solid var(--border); flex-shrink: 0; }
    .node-card {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 16px; border-bottom: 1px solid var(--border); transition: background 0.15s;
    }
    .node-card:hover { background: var(--surface2); }
    .sev-pill {
      padding: 2px 7px; border-radius: 12px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.4px; flex-shrink: 0; margin-top: 1px;
    }
    .sev-INFO     { background: #6b708922; color: var(--muted); }
    .sev-WARNING  { background: #FF950020; color: var(--amber); }
    .sev-ERROR    { background: #FF3B3020; color: var(--red); }
    .sev-CRITICAL { background: #FF3B3030; color: var(--red); font-weight: 700; }
    .node-content { flex: 1; min-width: 0; }
    .node-label { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-meta { display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
    .node-source { font-size: 11px; color: var(--blue); }
    .node-time { font-size: 11px; color: var(--muted); }
    .node-type { font-size: 10px; color: var(--muted); background: var(--surface2); padding: 1px 5px; border-radius: 4px; }

    /* CENTER: CHAT */
    .panel-center { width: 30%; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; align-items: flex-start; }
    .msg-role { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 3px; color: var(--muted); }
    .msg-bubble { padding: 9px 13px; border-radius: 14px; font-size: 12px; line-height: 1.55; }
    .msg.user .msg-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 3px; }
    .msg.agent .msg-bubble { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .msg.agent .msg-bubble strong { color: var(--blue); }
    .msg.agent .msg-bubble p { margin-bottom: 6px; }
    .msg.agent .msg-bubble p:last-child { margin-bottom: 0; }
    .chat-input-area {
      padding: 10px 14px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; flex-shrink: 0; background: rgba(22,24,32,0.6);
    }
    .chat-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 12px; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 12px; outline: none;
      transition: border-color 0.15s; resize: none;
    }
    .chat-input:focus { border-color: var(--blue); }
    .chat-input::placeholder { color: var(--muted); }
    .chat-input:disabled { opacity: 0.5; }

    /* SIM */
    .sim-panel { border-top: 1px solid var(--border); background: var(--surface); }
    .sim-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; cursor: pointer; user-select: none; }
    .sim-header-label { font-size: 10px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
    .sim-chevron { font-size: 9px; color: var(--muted); transition: transform 0.2s; }
    .sim-chevron.open { transform: rotate(180deg); }
    .sim-body { padding: 8px 14px 12px; display: flex; gap: 7px; flex-wrap: wrap; }
    .sim-body.collapsed { display: none; }
    .sim-btn {
      padding: 5px 11px; border-radius: var(--radius); font-size: 11px; font-weight: 500;
      font-family: 'Inter', sans-serif; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); transition: all 0.15s;
    }
    .sim-btn:hover { border-color: var(--blue); color: var(--blue); background: #007AFF12; }
    .sim-btn.cascade { border-color: #FF3B3040; color: var(--red); }
    .sim-btn.cascade:hover { background: #FF3B3015; }
    .sim-btn:disabled { opacity: 0.4; cursor: default; }

    /* RIGHT: INCIDENT HISTORY */
    .panel-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .incident-list { flex: 1; overflow-y: auto; }

    .incident-row {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.15s; display: flex; flex-direction: column; gap: 5px;
    }
    .incident-row:hover { background: var(--surface2); }
    .incident-row.live { border-left: 2px solid var(--blue); }

    .incident-row-top { display: flex; align-items: center; gap: 8px; }
    .incident-id { font-size: 11px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .live-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--blue); background: #007AFF18; border: 1px solid #007AFF40;
      padding: 1px 6px; border-radius: 8px;
    }
    .incident-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .incident-summary {
      font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; font-style: italic;
    }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      width: 80vw; max-width: 900px; max-height: 85vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .modal-title { font-size: 14px; font-weight: 600; flex: 1; }
    .modal-close {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--surface2); color: var(--muted); cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    .modal-body { display: flex; flex: 1; overflow: hidden; }
    .modal-chat { width: 55%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border); }
    .modal-nodes { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .modal-node-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .modal-node-row:last-child { border-bottom: none; }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* TYPING */
    .typing-indicator { display: flex; gap: 4px; align-items: center; }
    .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: typing 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:0.5} 30%{transform:translateY(-4px);opacity:1} }

    @media (max-width: 900px) {
      .panel-center { width: 40%; }
      .panel-right { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Deploy<span>D</span></div>
    <div id="status-badge" class="status-badge healthy">
      <div class="status-dot"></div>
      <span id="status-text">Healthy</span>
    </div>
    <div class="spacer"></div>
    <div class="kpi">Nodes: <strong id="node-count">0</strong></div>
    <div class="kpi" style="margin-left:8px;">Edges: <strong id="edge-count">0</strong></div>
    <button class="btn btn-danger" style="margin-left:16px;" onclick="resetState()">Close Incident</button>
  </header>

  <div class="main">
    <!-- LEFT: GRAPH + FEED -->
    <div class="panel-left">
      <div class="panel-title">Causal Incident Graph</div>
      <div id="graph-canvas"></div>
      <div class="node-feed" id="node-feed">
        <div class="empty-state">No events yet. Use the simulation panel below.</div>
      </div>
    </div>

    <!-- CENTER: CHAT + SIM -->
    <div class="panel-center">
      <div class="panel-title">SRE Agent</div>
      <div class="chat-messages" id="chat-messages">
        <div class="empty-state" id="chat-empty">Ingest telemetry events, then ask the SRE Agent to investigate.</div>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chat-input" placeholder="Ask the SRE Agent..." rows="1"
          onkeydown="handleKey(event)"></textarea>
        <button class="btn btn-primary" id="send-btn" onclick="sendChat()">Send</button>
      </div>
      <div class="sim-panel">
        <div class="sim-header" onclick="toggleSim()">
          <span class="sim-header-label">Simulate Events</span>
          <span class="sim-chevron open" id="sim-chevron">&#9650;</span>
        </div>
        <div class="sim-body" id="sim-body">
          <button class="sim-btn" onclick="sendPreset('db_latency')">DB Latency Spike</button>
          <button class="sim-btn" onclick="sendPreset('auth_timeout')">Auth Timeout</button>
          <button class="sim-btn" onclick="sendPreset('gateway_500')">Gateway 500</button>
          <button class="sim-btn cascade" onclick="sendCascade()">Full Cascade x50</button>
        </div>
      </div>
    </div>

    <!-- RIGHT: INCIDENT HISTORY -->
    <div class="panel-right">
      <div class="panel-title">Incident History</div>
      <div class="incident-list" id="incident-list">
        <div class="empty-state">No incidents yet.<br/>Incidents are saved when you close them.</div>
      </div>
    </div>
  </div>
</div>

<!-- INCIDENT DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Incident Detail</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;" id="modal-meta"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div class="modal-body">
      <div class="modal-chat" id="modal-chat"></div>
      <div class="modal-nodes" id="modal-nodes"></div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8081';

// ── VIS-NETWORK ───────────────────────────────────────────────────────────────
const networkNodes = new vis.DataSet([]);
const networkEdges = new vis.DataSet([]);
const network = new vis.Network(
  document.getElementById('graph-canvas'),
  { nodes: networkNodes, edges: networkEdges },
  {
    physics: { enabled: true, barnesHut: { gravitationalConstant: -4000, springLength: 140, damping: 0.2 } },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#3a3d50', highlight: '#007AFF' },
      width: 1.5, smooth: { type: 'curvedCW', roundness: 0.2 }
    },
    nodes: { shape: 'dot', size: 14, font: { color: '#e4e6f0', size: 11, face: 'Inter' }, borderWidth: 2 },
    interaction: { tooltipDelay: 200, hover: true },
    layout: { improvedLayout: false }
  }
);

function sevColor(s) { return ({INFO:'#6b7089',WARNING:'#FF9500',ERROR:'#FF3B30',CRITICAL:'#FF3B30'})[s]||'#6b7089'; }
function sevBorder(s) { return ({INFO:'#8a8faa',WARNING:'#ffb340',ERROR:'#ff6055',CRITICAL:'#ff0000'})[s]||'#8a8faa'; }

// ── STATE ──────────────────────────────────────────────────────────────────────
let knownNodeIds = new Set(), knownEdgeIds = new Set();
let chatHistory = [], pendingSend = false, simOpen = true;

// ── POLL LIVE STATE ─────────────────────────────────────────────────────────────
async function poll() {
  try {
    const res = await fetch(`${API}/api/v1/state`);
    if (!res.ok) return;
    const d = await res.json();
    updateStatus(d.tracker_status);
    updateGraph(d.graphs.nodes, d.graphs.edges);
    updateChat(d.chat_history);
  } catch (_) {}
}

function updateStatus(s) {
  document.getElementById('status-badge').className = 'status-badge ' + (s||'healthy').toLowerCase();
  document.getElementById('status-text').textContent = s || 'Healthy';
}

function updateGraph(nodes, edges) {
  document.getElementById('node-count').textContent = nodes.length;
  document.getElementById('edge-count').textContent = edges.length;
  const curIds = new Set(nodes.map(n => n.id));
  [...knownNodeIds].filter(id => !curIds.has(id)).forEach(id => { networkNodes.remove(id); knownNodeIds.delete(id); });
  nodes.forEach(n => {
    const d = { id: n.id, label: (n.source||'?')+'\n'+(n.type||''), title: n.label,
      color: { background: sevColor(n.severity)+'22', border: sevBorder(n.severity), highlight: { background: sevColor(n.severity)+'44', border: sevBorder(n.severity) } },
      size: n.severity === 'CRITICAL' ? 20 : 14 };
    knownNodeIds.has(n.id) ? networkNodes.update(d) : (networkNodes.add(d), knownNodeIds.add(n.id));
  });
  const curEdgeIds = new Set(edges.map(e => e.source+'->'+e.target));
  [...knownEdgeIds].filter(id => !curEdgeIds.has(id)).forEach(id => { networkEdges.remove(id); knownEdgeIds.delete(id); });
  edges.forEach(e => {
    const eid = e.source+'->'+e.target;
    if (!knownEdgeIds.has(eid)) {
      networkEdges.add({ id: eid, from: e.source, to: e.target,
        title: `${e.relationship} | ${e.rule_id||''} | ${Math.round(e.confidence*100)}%`,
        color: { color: e.relationship==='CAUSAL' ? '#FF9500' : '#4a4d66' }, dashes: e.relationship!=='CAUSAL' });
      knownEdgeIds.add(eid);
    }
  });
  renderNodeFeed(nodes);
}

function renderNodeFeed(nodes) {
  const feed = document.getElementById('node-feed');
  if (!nodes.length) { feed.innerHTML = '<div class="empty-state">No events yet. Use the simulation panel below.</div>'; return; }
  feed.innerHTML = [...nodes].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(n => {
    const t = new Date(n.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<div class="node-card">
      <span class="sev-pill sev-${n.severity}">${n.severity}</span>
      <div class="node-content">
        <div class="node-label" title="${n.label}">${n.label}</div>
        <div class="node-meta"><span class="node-source">${n.source||'—'}</span><span class="node-type">${n.type}</span><span class="node-time">${t}</span></div>
      </div></div>`;
  }).join('');
}

// ── CHAT ───────────────────────────────────────────────────────────────────────
function updateChat(history) {
  if (!history || history.length === chatHistory.length) return;
  if (pendingSend && history.at(-1)?.role === 'agent') { pendingSend = false; enableInput(); removeTyping(); }
  chatHistory = [...history];
  renderChat(document.getElementById('chat-messages'), chatHistory, true);
}

function renderChat(container, history, scrollToBottom) {
  container.querySelectorAll('.msg').forEach(m => m.remove());
  document.getElementById('chat-empty')?.remove();
  const typing = container.querySelector('.msg-typing');
  history.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'msg ' + (msg.role==='user' ? 'user' : 'agent');
    const content = msg.role==='agent' ? marked.parse(msg.content) : esc(msg.content);
    div.innerHTML = `<div class="msg-role">${msg.role==='user'?'You':'SRE Agent'}</div><div class="msg-bubble">${content}</div>`;
    typing ? container.insertBefore(div, typing) : container.appendChild(div);
  });
  if (scrollToBottom) container.scrollTop = container.scrollHeight;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showTyping() {
  const c = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg agent msg-typing';
  div.innerHTML = `<div class="msg-role">SRE Agent</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  c.appendChild(div); c.scrollTop = c.scrollHeight;
}
function removeTyping() { document.querySelector('.msg-typing')?.remove(); }
function enableInput() {
  document.getElementById('chat-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('send-btn').textContent = 'Send';
}
function disableInput() {
  document.getElementById('chat-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('send-btn').textContent = '...';
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const prompt = input.value.trim();
  if (!prompt || pendingSend) return;
  input.value = ''; pendingSend = true; disableInput();
  const c = document.getElementById('chat-messages');
  document.getElementById('chat-empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="msg-role">You</div><div class="msg-bubble">${esc(prompt)}</div>`;
  c.appendChild(d); showTyping(); c.scrollTop = c.scrollHeight;
  try {
    await fetch(`${API}/api/v1/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt}) });
  } catch(_) { removeTyping(); pendingSend=false; enableInput(); }
}

function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendChat(); } }

// ── RESET ──────────────────────────────────────────────────────────────────────
async function resetState() {
  await fetch(`${API}/api/v1/reset`, {method:'POST'});
  networkNodes.clear(); networkEdges.clear(); knownNodeIds.clear(); knownEdgeIds.clear();
  chatHistory=[]; pendingSend=false; enableInput();
  document.getElementById('chat-messages').innerHTML = '<div class="empty-state" id="chat-empty">Ingest telemetry events, then ask the SRE Agent to investigate.</div>';
  document.getElementById('node-feed').innerHTML = '<div class="empty-state">No events yet. Use the simulation panel below.</div>';
  updateStatus('Healthy');
  document.getElementById('node-count').textContent='0';
  document.getElementById('edge-count').textContent='0';
  pollIncidents();
}

// ── SIMULATION ─────────────────────────────────────────────────────────────────
const PRESETS = {
  db_latency:   { source:'postgres-primary', event_type:'LATENCY',        metadata:{latency_ms:842,value:842},          description:'PostgreSQL query latency spike' },
  auth_timeout: { source:'auth-service',     event_type:'REQUEST_TIMEOUT', metadata:{duration_ms:5000},                 description:'auth-service postgres connection timeout' },
  gateway_500:  { source:'api-gateway',      event_type:'HTTP_RESPONSE',   metadata:{status_code:503,latency_ms:6200},  description:'api-gateway 503 from auth-service upstream' },
};
async function postEvent(key) {
  await fetch(`${API}/api/v1/events`, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({...PRESETS[key], timestamp: new Date().toISOString()}) });
}
async function sendPreset(key) { await postEvent(key); }
async function sendCascade() {
  document.querySelectorAll('.sim-btn').forEach(b=>b.disabled=true);
  const seq = ['db_latency','db_latency','db_latency','auth_timeout','auth_timeout','gateway_500'];
  for (let r=0; r<Math.ceil(50/seq.length); r++)
    for (const k of seq) { await postEvent(k); await new Promise(r=>setTimeout(r,150)); }
  document.querySelectorAll('.sim-btn').forEach(b=>b.disabled=false);
}
function toggleSim() {
  simOpen=!simOpen;
  document.getElementById('sim-body').classList.toggle('collapsed',!simOpen);
  document.getElementById('sim-chevron').classList.toggle('open',simOpen);
}

// ── INCIDENT HISTORY ───────────────────────────────────────────────────────────
async function pollIncidents() {
  try {
    const res = await fetch(`${API}/api/v1/incidents`);
    if (!res.ok) return;
    renderIncidents(await res.json());
  } catch(_) {}
}

function severityClass(s) {
  return ({INFO:'sev-INFO',WARNING:'sev-WARNING',ERROR:'sev-ERROR',CRITICAL:'sev-CRITICAL'})[s]||'sev-INFO';
}

function renderIncidents(incidents) {
  const list = document.getElementById('incident-list');
  if (!incidents.length) { list.innerHTML = '<div class="empty-state">No incidents yet.<br/>Incidents are saved when you close them.</div>'; return; }
  list.innerHTML = incidents.map(inc => {
    const opened = new Date(inc.opened_at);
    const dateStr = opened.toLocaleDateString([],{month:'short',day:'numeric'});
    const timeStr = opened.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const duration = inc.duration_seconds !== null
      ? (inc.duration_seconds < 60 ? `${Math.round(inc.duration_seconds)}s` : `${Math.round(inc.duration_seconds/60)}m`)
      : null;
    const summary = inc.root_cause_summary ? inc.root_cause_summary.replace(/\*\*/g,'').slice(0,80)+'…' : '';
    const isLive = inc.status === 'OPEN';
    return `<div class="incident-row ${isLive?'live':''}" onclick="openIncident('${inc.id}')">
      <div class="incident-row-top">
        <span class="sev-pill ${severityClass(inc.peak_severity)}">${inc.peak_severity}</span>
        <span class="incident-id">#${inc.id.slice(0,8)}</span>
        ${isLive ? '<span class="live-badge">● LIVE</span>' : ''}
      </div>
      <div class="incident-meta">
        <span>${dateStr} ${timeStr}</span>
        ${duration ? `<span>${duration}</span>` : ''}
        <span>${inc.node_count} nodes</span>
      </div>
      ${summary ? `<div class="incident-summary">${esc(summary)}</div>` : ''}
    </div>`;
  }).join('');
}

async function openIncident(id) {
  try {
    const res = await fetch(`${API}/api/v1/incidents/${id}`);
    if (!res.ok) return;
    const inc = await res.json();
    showModal(inc);
  } catch(_) {}
}

function showModal(inc) {
  const opened = new Date(inc.opened_at).toLocaleString();
  const resolved = inc.resolved_at ? new Date(inc.resolved_at).toLocaleString() : 'OPEN';
  document.getElementById('modal-title').textContent = `Incident #${inc.id.slice(0,8)}`;
  document.getElementById('modal-meta').textContent = `${opened} → ${resolved} · ${inc.peak_severity} · ${inc.graph_snapshot.length} nodes`;

  const chatContainer = document.getElementById('modal-chat');
  chatContainer.innerHTML = '';
  if (!inc.chat_history.length) {
    chatContainer.innerHTML = '<div class="empty-state">No agent conversation for this incident.</div>';
  } else {
    inc.chat_history.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.role==='user'?'user':'agent');
      const content = msg.role==='agent' ? marked.parse(msg.content) : esc(msg.content);
      div.innerHTML = `<div class="msg-role">${msg.role==='user'?'You':'SRE Agent'}</div><div class="msg-bubble">${content}</div>`;
      chatContainer.appendChild(div);
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  const nodesContainer = document.getElementById('modal-nodes');
  nodesContainer.innerHTML = '';
  if (!inc.graph_snapshot.length) {
    nodesContainer.innerHTML = '<div class="empty-state">No graph snapshot.</div>';
  } else {
    const label = document.createElement('div');
    label.className = 'panel-title';
    label.style.cssText = 'padding:0 0 10px; border:none; margin-bottom:4px;';
    label.textContent = `Graph Snapshot (${inc.graph_snapshot.length} nodes)`;
    nodesContainer.appendChild(label);
    inc.graph_snapshot.forEach(n => {
      const t = new Date(n.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const row = document.createElement('div');
      row.className = 'modal-node-row';
      row.innerHTML = `<span class="sev-pill ${severityClass(n.severity)}">${n.severity}</span>
        <div class="node-content">
          <div class="node-label" title="${n.label}">${n.label}</div>
          <div class="node-meta"><span class="node-source">${n.source||'—'}</span><span class="node-type">${n.type}</span><span class="node-time">${t}</span></div>
        </div>`;
      nodesContainer.appendChild(row);
    });
  }

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay') || e.currentTarget?.classList?.contains('modal-close'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ── START ──────────────────────────────────────────────────────────────────────
poll();
pollIncidents();
setInterval(poll, 2000);
setInterval(pollIncidents, 8000);
</script>
