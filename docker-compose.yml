services:
  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      ANONYMIZED_TELEMETRY: "false"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chroma:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - demo/live_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    # Pure API client: no Chroma access and no LLM key (only the backend holds it).
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    environment:
      - DEPLOYD_API_URL=http://backend:8000
      # the graph iframe fetches the API from the browser
      - DEPLOYD_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  chroma_data:
